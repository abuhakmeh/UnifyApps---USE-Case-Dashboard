# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
services:
  - type: web
    name: unifyapps-use-case-universe
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
